name: Vuurland Spotify Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: vuurland-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Vuurland 24/7 synchroniseren
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          VUURLAND_DATA_DIR: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          END_TIME=$((SECONDS + 345 * 60))
          SYNC_EXIT=0

          push_state() {
            git add \
              vuurland_seen.json \
              vuurland_live_queue.json \
              .vuurland_spotify_cache.json

            if git diff --cached --quiet; then
              echo "ℹ️ Geen state-wijzigingen."
              return 0
            fi

            git commit -m "Update Vuurland sync state"

            for attempt in 1 2 3 4 5; do
              echo "🔄 Push-poging $attempt/5..."

              git fetch origin main

              if ! git rebase origin/main; then
                echo "❌ Rebase-conflict tijdens opslaan sync-state."
                git rebase --abort || true
                return 1
              fi

              if git push origin HEAD:main; then
                echo "✅ Sync-state opgeslagen op GitHub."
                return 0
              fi

              echo "⚠️ Push mislukt. GitHub kan veranderd zijn of tijdelijk onbereikbaar zijn."

              if [ "$attempt" -lt 5 ]; then
                echo "⏳ 15 seconden wachten en opnieuw proberen..."
                sleep 15
              fi
            done

            echo "❌ Push is na 5 pogingen nog steeds mislukt."
            return 1
          }

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            echo ""
            echo "========================================"
            echo "📻 Vuurland sync"
            date
            echo "========================================"

            set +e
            python3 -u vuurland_sync.py
            SYNC_EXIT=$?
            set -e

            echo ""
            echo "💾 Sync-status opslaan..."

            if [ "$SYNC_EXIT" -ne 0 ]; then
              echo "⚠️ Sync-run gestopt met code $SYNC_EXIT."
              echo "🛑 Geen nieuwe Spotify-request in deze runner."
              break
            fi

            if ! push_state; then
              echo "🛑 State kon niet veilig naar GitHub worden gepusht."
              exit 1
            fi

            REMAINING=$((END_TIME - SECONDS))

            if [ "$REMAINING" -le 180 ]; then
              break
            fi

            echo "⏳ Wachten op volgende controle..."

            for i in 1 2 3 4; do
              sleep 30
              echo "⏳ Nog bezig... $((i * 30))/120 seconden"
            done
          done

          echo ""
          echo "🏁 Deze runner gaat stoppen."

          if [ "${SYNC_EXIT:-0}" -eq 0 ]; then
            echo "🔄 Nieuwe runner wordt gestart..."

            gh workflow run vuurland.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main
          else
            echo "⏸️ Geen nieuwe runner gestart vanwege Spotify-rate-limit."
            echo "🕒 De geplande workflow probeert later opnieuw."
          fi
