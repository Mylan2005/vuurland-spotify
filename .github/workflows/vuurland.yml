name: Vuurland Spotify Sync (uitgeschakeld)

# Vuurland-sync op verzoek gestopt: geen radiobronnen ophalen,
# geen playlists aanpassen en geen tracks aan Liked Songs toevoegen.
# Alleen handmatig te starten als zichtbare controle; ook dan geen sync.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-uitgeschakeld:
    runs-on: ubuntu-24.04
    steps:
      - name: Bevestig dat Vuurland is uitgeschakeld
        run: |
          echo "⏸️ Vuurland-sync uitgeschakeld op verzoek."
          echo "📻 Geen van de 12 radiobronnen wordt opgehaald."
          echo "🎵 Er worden geen nummers toegevoegd aan Spotify-playlists of Liked Songs."
          echo "💾 Bestaande muziek en opgeslagen state blijven behouden."
