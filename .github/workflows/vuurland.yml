name: Vuurland Spotify Sync

on:
  workflow_dispatch:
  schedule:
    # Elke 6 uur een nieuwe lange runner starten.
    # Niet op minuut 0 om drukte rond het begin van het uur te vermijden.
    - cron: "17 */6 * * *"

concurrency:
  group: vuurland-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Controle secrets
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          echo "Client ID lengte: ${#SPOTIFY_CLIENT_ID}"
          echo "Refresh token lengte: ${#SPOTIFY_REFRESH_TOKEN}"

      - name: Vuurland continu synchroniseren
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          VUURLAND_DATA_DIR: ${{ github.workspace }}
        run: |
          END_TIME=$((SECONDS + 345 * 60))

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            echo ""
            echo "========================================"
            echo "📻 Vuurland sync gestart"
            date
            echo "========================================"

            python3 -u vuurland_sync.py || true

            echo ""
            echo "💾 Sync-status opslaan..."

            git add vuurland_seen.json vuurland_queue.json .vuurland_spotify_cache.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Vuurland sync state"
              git push
            else
              echo "ℹ️ Geen wijzigingen om op te slaan."
            fi

            REMAINING=$((END_TIME - SECONDS))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            echo ""
            echo "⏳ Volgende controle over 5 minuten..."
            sleep 300
          done

          echo ""
          echo "🏁 Deze lange sync-run is afgelopen."
          echo "GitHub start later automatisch een nieuwe runner."
