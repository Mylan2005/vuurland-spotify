name: Vuurland Spotify Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: vuurland-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Vuurland 24/7 synchroniseren
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          VUURLAND_DATA_DIR: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          END_TIME=$((SECONDS + 345 * 60))

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            echo ""
            echo "========================================"
            echo "📻 Vuurland sync"
            date
            echo "========================================"

            set +e
            python3 -u vuurland_sync.py
            SYNC_EXIT=$?
            set -e

            echo ""
            echo "💾 Sync-status opslaan..."

            if [ "$SYNC_EXIT" -ne 0 ]; then
              echo "⚠️ Sync-run gestopt met code $SYNC_EXIT."
              echo "⏳ Deze runner stopt gecontroleerd."
            fi

            git add vuurland_seen.json vuurland_queue.json .vuurland_spotify_cache.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Vuurland sync state"
              git push
            else
              echo "ℹ️ Geen wijzigingen."
            fi

            REMAINING=$((END_TIME - SECONDS))

            if [ "$REMAINING" -le 180 ]; then
              break
            fi

            echo "⏳ Korte pauze voor volgende controle..."
            sleep 30
          done

          echo ""
          echo "🏁 Deze runner gaat stoppen."
          echo "🔄 Nieuwe runner wordt gestart..."

          gh workflow run vuurland.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
