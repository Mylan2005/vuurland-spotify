name: Duyster archief meerdere keren per dag controleren

on:
  schedule:
    # Vier controles per dag, elke vier uur, ook buiten woensdag.
    # GitHub schedule kan vertraagd starten: nooit afbreken op lokale minuten.
    # 07, 11, 15, 19 UTC = 08/12/16/20 CET of 09/13/17/21 CEST.
    - cron: '0 7,11,15,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duyster-weekly-archive
  cancel-in-progress: false

jobs:
  archief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Controleer gepland of handmatig gestart
        id: belgian_time
        run: |
          # GitHub Actions cron-runs kunnen minuten/uren vertraagd starten.
          # Geen exacte-klokpoort: iedere geplande run mag veilig controleren.
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Benodigdheden voor alleen Duyster-website installeren
        if: steps.belgian_time.outputs.should_run == 'true'
        run: python -m pip install requests beautifulsoup4

      - name: Nieuwe Duyster-aflevering(en) in archief opnemen
        if: steps.belgian_time.outputs.should_run == 'true'
        run: python duyster_weekly_update.py

      - name: Alleen gewijzigde Duyster-archiefbestanden bewaren
        if: steps.belgian_time.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- duyster_archief_uniek.csv duyster_archief_import_state.json
          if git diff --cached --quiet; then
            echo "Geen nieuwe Duyster-afleveringen, niets te committen."
            exit 0
          fi
          git commit -m "Import new Duyster playlist episodes into music archive"
          # Spotify-sync mag intussen zijn state naar main committen.
          # Herbaseer uitsluitend onze twee archiefbestanden; geen force-push.
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Duyster-archief veilig bijgewerkt."
              exit 0
            fi
            echo "Main is intussen gewijzigd; opnieuw proberen."
            sleep 4
          done
          echo "Kon archief door concurrerende commits niet publiceren; volgende run haalt in."
          exit 1
