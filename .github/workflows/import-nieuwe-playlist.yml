name: Playlist en Liked Songs veilig inlezen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vuurland-sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Alleen Spotify lezen en gecontroleerde cache maken
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 import_nieuwe_playlist.py
      - name: Cache opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vuurland_spotify_cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import 2733 existing Spotify tracks into dedupe cache"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
