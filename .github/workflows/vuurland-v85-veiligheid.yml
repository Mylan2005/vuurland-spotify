permissions:
  contents: read
jobs:
  regressie:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python-afhankelijkheden installeren
        run: python -m pip install requests beautifulsoup4

      - name: Gedeelde volledige offline veiligheidstests
        run: bash scripts/spotify_preflight.sh
